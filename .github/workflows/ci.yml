name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The single canonical validation suite (restore, format check, build, test) - the same verbs
      # scripts/open-pr.py runs locally. See docs/CI Releases.md.
      - name: Validate
        run: python scripts/validate.py
