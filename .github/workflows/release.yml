name: Release

# The default run title is the head commit message (a rebase merge has no PR title), which says nothing about the run.
run-name: Creating Release Artifacts

# Every merge to main that touches launcher code gets the next vMAJOR.MINOR.PATCH tag
# (MAJOR.MINOR from .version, PATCH auto-incremented by scripts/release.py) and a GitHub Release
# with a self-contained win-x64 zip and a linux-x64 tar.gz. Pull requests do not build packages (ci.yml
# validates them); a manual workflow_dispatch run builds the packages as workflow artifacts without tagging
# or publishing anything. Mirrors critical-mass-client's flow.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - '.version'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Creating Windows Release Artifacts
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer and release.py need the full tag history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DW2ModLauncher.sln

      # Same gates as ci.yml: never release something that wouldn't pass CI.
      - name: Test
        run: dotnet test src/DW2ModLauncher.Tests -c Release

      - name: Tag release
        id: release
        if: github.event_name == 'push'
        run: python scripts/release.py

      # MinVer reads the tag created above (or, for a manual run, produces a pre-release version).
      - name: Publish (self-contained, single-file)
        run: >
          dotnet publish src/DW2ModLauncher.Avalonia -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=false -p:DebugType=none
          -o publish

      - name: Package
        id: package
        shell: pwsh
        run: |
          $exe = Get-Item publish/DW2ModLauncher.exe
          $version = $exe.VersionInfo.ProductVersion -replace '\+.*$', ''
          $name = "DW2ModLauncher-v$version-win-x64"
          $stage = Join-Path $PWD "stage/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item publish/* $stage -Recurse
          Copy-Item LICENSE, README.md $stage
          Compress-Archive -Path "stage/$name" -DestinationPath "$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=$name.zip" >> $env:GITHUB_OUTPUT

      # Upload the staged folder, not the zip: the artifact download is itself a zip, so uploading the
      # zip would nest it. (The GitHub Release below still gets the real zip.)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: stage/${{ steps.package.outputs.name }}

      - name: Create GitHub Release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The notes are the docs/focus.md list that was the PR description; GitHub's generated notes
          # (a bare rebase-merge commit list) are only the fallback when that list is empty.
          python scripts/release-notes.py release-notes.md
          if [ -f release-notes.md ]; then notes=(--notes-file release-notes.md); else notes=(--generate-notes); fi
          gh release create "${{ steps.release.outputs.tag }}" "${{ steps.package.outputs.zip }}" --title "${{ steps.release.outputs.tag }}" "${notes[@]}"

  # The Linux build: the Avalonia launcher, self-contained, as a tar.gz (keeps the executable bit). It runs
  # after the Windows job so that job's tag exists; it attaches to the same GitHub Release.
  release-linux:
    name: Creating Linux Release Artifacts
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The Windows job pushed the tag after this checkout was cut, so fetch it before MinVer reads tags.
      - name: Fetch tags
        run: git fetch --tags --force

      - name: Publish (self-contained)
        run: >
          dotnet publish src/DW2ModLauncher.Avalonia -c Release -r linux-x64 --self-contained
          -p:DebugType=none -o publish

      - name: Package
        id: package
        run: |
          # InformationalVersion (set in Directory.Build.props) is what the Windows job reads from the exe: the plain tag
          # on a release, "X.Y.Z-dev" on a PR build. Not MinVerVersion, which carries MinVer's "-alpha.0.N" suffix.
          version=$(dotnet msbuild src/DW2ModLauncher.Avalonia -t:MinVer -getProperty:InformationalVersion -v:q | tail -1)
          name="DW2ModLauncher-v${version}-linux-x64"
          mkdir -p "stage/${name}"
          cp -a publish/. "stage/${name}/"
          cp LICENSE README.md "stage/${name}/"
          tar -czf "${name}.tar.gz" -C stage "${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: stage/${{ steps.package.outputs.name }}

      - name: Attach to GitHub Release
        if: needs.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ steps.package.outputs.archive }}"
