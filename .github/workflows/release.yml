name: Release

# Every merge to main that touches launcher code gets the next vMAJOR.MINOR.PATCH tag
# (MAJOR.MINOR from .version, PATCH auto-incremented by scripts/release.py) and a GitHub Release
# with a self-contained win-x64 zip and a linux-x64 tar.gz. Pull requests touching the same paths (and manual
# workflow_dispatch runs) build the zip as a workflow artifact without tagging or publishing
# anything, so packaging problems show up before merge. Mirrors critical-mass-client's flow.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - '.version'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - '.version'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer and release.py need the full tag history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DW2ModLauncher.sln

      # Same gates as ci.yml: never release something that wouldn't pass CI.
      - name: Test
        run: dotnet test src/DW2ModLauncher.Tests -c Release

      - name: Tag release
        id: release
        if: github.event_name == 'push'
        run: python scripts/release.py

      # MinVer reads the tag created above (or, for a manual run, produces a pre-release version).
      - name: Publish (self-contained, single-file)
        run: >
          dotnet publish src/DW2ModLauncher.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=false -p:DebugType=none
          -o publish

      - name: Package
        id: package
        shell: pwsh
        run: |
          $exe = Get-Item publish/DW2ModLauncher.exe
          $version = $exe.VersionInfo.ProductVersion -replace '\+.*$', ''
          $name = "DW2ModLauncher-v$version-win-x64"
          $stage = Join-Path $PWD "stage/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item publish/* $stage -Recurse
          Copy-Item launcher_settings.example.json, LICENSE, README.md $stage
          Compress-Archive -Path "stage/$name" -DestinationPath "$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=$name.zip" >> $env:GITHUB_OUTPUT

      # Upload the staged folder, not the zip: the artifact download is itself a zip, so uploading the
      # zip would nest it. (The GitHub Release below still gets the real zip.)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: stage/${{ steps.package.outputs.name }}

      - name: Create GitHub Release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" "${{ steps.package.outputs.zip }}" --title "${{ steps.release.outputs.tag }}" --generate-notes

  # The Linux build: the Avalonia launcher, self-contained, as a tar.gz (keeps the executable bit). It runs
  # after the Windows job so that job's tag exists; it attaches to the same GitHub Release.
  release-linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The Windows job pushed the tag after this checkout was cut, so fetch it before MinVer reads tags.
      - name: Fetch tags
        run: git fetch --tags --force

      - name: Publish (self-contained)
        run: >
          dotnet publish src/DW2ModLauncher.Avalonia -c Release -r linux-x64 --self-contained
          -p:DebugType=none -o publish

      - name: Package
        id: package
        run: |
          version=$(dotnet msbuild src/DW2ModLauncher.Avalonia -t:MinVer -getProperty:MinVerVersion -v:q | tail -1)
          name="DW2ModLauncher-v${version}-linux-x64"
          mkdir -p "stage/${name}"
          cp -a publish/. "stage/${name}/"
          cp launcher_settings.example.json LICENSE README.md "stage/${name}/"
          tar -czf "${name}.tar.gz" -C stage "${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: stage/${{ steps.package.outputs.name }}

      - name: Attach to GitHub Release
        if: needs.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ steps.package.outputs.archive }}"
